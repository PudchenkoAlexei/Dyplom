[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
KPI_PHONE_RECORDING_DIR=/var/spool/asterisk/recording/kpi
KPI_PHONE_RESPONSE_DIR=/var/lib/asterisk/sounds/kpi/responses
KPI_PHONE_END_SILENCE_MS=1500
KPI_PHONE_END_SILENCE_SECONDS=2
KPI_PHONE_MAX_QUESTION_SECONDS=30
KPI_PHONE_START_SPEECH_TIMEOUT_SECONDS=25

[from-internal]
exten => 7000,1,NoOp(KPI phone assistant call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(CALL_BASE=${UNIQUEID})
 same => n,Set(QUESTION_INDEX=0)
 same => n,Playback(kpi/welcome)
 same => n,Playback(beep)
 same => n(next),Set(QUESTION_INDEX=$[${QUESTION_INDEX} + 1])
 same => n,Set(CALL_ID=${CALL_BASE}-${QUESTION_INDEX})
 same => n,Set(QUESTION_AUDIO=${KPI_PHONE_RECORDING_DIR}/${CALL_ID}.wav)
 same => n,NoOp(KPI phone assistant listening for question ${CALL_ID})
 same => n,Set(KPI_RECORD_STATUS=)
 same => n,Set(EAGI_AUDIO_FORMAT=slin)
 same => n,EAGI(/usr/local/bin/kpi_record_question.py,${QUESTION_AUDIO},${KPI_PHONE_START_SPEECH_TIMEOUT_SECONDS},${KPI_PHONE_END_SILENCE_SECONDS},${KPI_PHONE_MAX_QUESTION_SECONDS})
 same => n,GotoIf($["${KPI_RECORD_STATUS}" = "SPEECH"]?process:noinput)
 same => n(process),Set(RESPONSE_SOUND=kpi/responses/${CALL_ID})
 same => n,System(/usr/local/bin/kpi_phone_assistant.py "${CALLERID(num)}" "${CALL_ID}" "${QUESTION_AUDIO}" "${KPI_PHONE_RESPONSE_DIR}/${CALL_ID}.wav")
 same => n,GotoIf($["${SYSTEMSTATUS}" = "SUCCESS"]?play:error)
 same => n(play),Playback(${RESPONSE_SOUND})
 same => n,Playback(kpi/next_question)
 same => n,Goto(next)
 same => n(noinput),Playback(kpi/idle_timeout)
 same => n,Hangup()
 same => n(error),Playback(beeperr)
 same => n,Hangup()
