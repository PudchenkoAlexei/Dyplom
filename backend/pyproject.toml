[project]
name = "kpi-helpdesk-backend"
version = "0.1.0"
description = "FastAPI backend for voice-based KPI university helpdesk ticket processing."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "pydantic[email]>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "pyjwt>=2.9.0",
  "pwdlib[argon2]>=0.2.1",
  "aiofiles>=24.1.0",
  "faster-whisper>=1.0.3",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "peft>=0.12.0",
  "accelerate>=0.33.0",
  "bitsandbytes>=0.49.0",
  "edge-tts>=6.1.12",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "storage*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
