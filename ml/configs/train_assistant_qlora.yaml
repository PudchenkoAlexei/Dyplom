base_model: Qwen/Qwen3-4B-Instruct-2507
questions_path: ml/data/assistant_dapt/eval_questions.jsonl
knowledge_base_path: backend/app/data/kpi_faq_knowledge_base.json
output_dir: ml/models/qwen3-kpi-assistant-qlora-4b

# Local assistant adaptation for an 8 GB GPU. This is QLoRA, not full DAPT.
quantization: 4bit
max_length: 1536
min_response_tokens: 64
include_question_answer_examples: true
include_context_answer_examples: true

gradient_checkpointing: true
num_train_epochs: 5
learning_rate: 0.0001
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
warmup_ratio: 0.05
weight_decay: 0.01
logging_steps: 5
eval_steps: 20
save_steps: 20
save_total_limit: 1
load_best_model_at_end: true
optim: paged_adamw_8bit
report_to: none

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
