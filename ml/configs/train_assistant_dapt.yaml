base_model: Qwen/Qwen3-4B-Instruct-2507
train_path: ml/data/assistant_dapt/train.jsonl
validation_path: ml/data/assistant_dapt/validation.jsonl
output_dir: ml/models/qwen3-4b-kpi-dapt

# Full domain-adaptive continued pretraining. This is intentionally not LoRA.
# Run it on the department server or another machine with enough GPU memory.
train_full_parameters: true
max_length: 1024
num_train_epochs: 3
max_steps: -1
learning_rate: 0.00001
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
warmup_ratio: 0.03
weight_decay: 0.01
gradient_checkpointing: true
torch_dtype: bfloat16
optim: adamw_torch
logging_steps: 5
eval_steps: 25
save_steps: 25
save_total_limit: 2
load_best_model_at_end: true
report_to: none
deepspeed:
