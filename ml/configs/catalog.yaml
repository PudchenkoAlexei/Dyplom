category_descriptions:
  стипендія: стипендіальні рейтинги, академічна або соціальна стипендія, виплата чи банківські реквізити
  гуртожиток / проживання: поселення, кімната, ремонт, побут, адміністрація гуртожитку, hostelpay або оплата проживання
  вступ: вступник, кабінет вступника, конкурсна пропозиція, статус заяви, документи для вступу, підготовчі курси для абітурієнтів
  навчальний процес: розклад, сесія, оцінки, відомості, практики, вибір дисциплін, академічна заборгованість
  деканат / довідки студентів: довідка про навчання, денна форма, роботодавець, військкомат, гарант освітньої програми, кафедра
  документи про освіту: диплом, додаток до диплома, дублікат диплома, документ про вищу освіту після випуску, апостиль, довідка про справжність диплома
  переведення / поновлення / відрахування: поновлення, переведення, відрахування, академвідпустка, зміна форми навчання або фінансування
  академічна мобільність: Erasmus, обмін, learning agreement, стажування, приймаючий університет, зарахування кредитів
  соціальна / психологічна підтримка: психолог, соціальна допомога, складні життєві обставини, переселенці, адаптація, кризова ситуація
  мережа / пошта / інтернет: Wi-Fi, інтернет, мережа, VPN, Moodle-доступ, корпоративна пошта kpi.ua, поштовий пароль
  Електронний кампус: ecampus, Електронний кампус, пароль кампусу, куратор групи, ролі, дисципліни, оцінки або журнал у кампусі
  бібліотека: читацький квиток, електронний каталог, книги, абонемент, репозитарій, Scopus, Web of Science, повнотекстові бази
  міжнародні студенти: іноземний студент, посвідка на проживання, зміна паспорта, віза, міграційна служба, легалізація, запрошення
  безпека / перепустки: перепустка, доступ до корпусу, охорона, пропускний режим, укриття, інцидент або загроза безпеці
  оплата навчання / фінанси: контракт, рахунок за навчання, борг за навчання, платник договору, акт звірки, подвійне списання
  інше / первинна маршрутизація: змішане, нестандартне або недостатньо конкретне звернення, КПІ-стікери, екскурсії, загальні пропозиції, акредитаційні довідки про університет

