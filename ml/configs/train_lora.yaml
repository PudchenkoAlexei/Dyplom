base_model: Qwen/Qwen3-1.7B
dataset_path: ml/data/curated/tickets_curated.jsonl
catalog_path: ml/configs/catalog.yaml
output_dir: ml/models/qwen3-kpi-lora
max_length: 1024
gradient_checkpointing: true
train_split: train
eval_split: validation
num_train_epochs: 2
load_best_model_at_end: true
learning_rate: 0.0002
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
warmup_ratio: 0.05
weight_decay: 0.01
logging_steps: 5
save_steps: 50
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
