base_model: Qwen/Qwen3-4B-Instruct-2507
dataset_path: ml/data/curated/tickets_curated.jsonl
catalog_path: ml/configs/catalog.yaml
output_dir: ml/models/qwen3-kpi-lora-4b
quantization: 4bit
max_length: 1152
gradient_checkpointing: true
train_split: train
eval_split: validation
num_train_epochs: 1
load_best_model_at_end: true
learning_rate: 0.0002
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
warmup_ratio: 0.05
weight_decay: 0.01
logging_steps: 10
eval_steps: 100
save_steps: 100
save_total_limit: 1
optim: adamw_torch
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
